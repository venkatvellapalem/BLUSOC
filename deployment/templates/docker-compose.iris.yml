# BLUSOC deployment for the stable DFIR-IRIS 2.4 image contract.
# Upstream reference: https://github.com/dfir-iris/iris-web/tree/v2.4.29
name: blusoc-iris

x-iris-runtime: &iris-runtime
  image: ghcr.io/dfir-iris/iriswebapp_app:${IRIS_VERSION:?IRIS_VERSION is required}
  restart: unless-stopped
  env_file:
    - path: application.env
      format: raw
  volumes:
    - ./certificates/rootCA/irisRootCACert.pem:/etc/irisRootCACert.pem:ro
    - ./certificates:/home/iris/certificates:ro
    - ./certificates/ldap:/iriswebapp/certificates/ldap:ro
    - iris_downloads:/home/iris/downloads
    - iris_templates:/home/iris/user_templates
    - iris_server_data:/home/iris/server_data
  networks:
    - iris-backend

services:
  iris-db:
    image: ghcr.io/dfir-iris/iriswebapp_db:${IRIS_VERSION:?IRIS_VERSION is required}
    restart: unless-stopped
    env_file:
      - path: database.env
        format: raw
    volumes:
      - iris_database:/var/lib/postgresql/data
    networks:
      - iris-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12

  iris-rabbitmq:
    image: rabbitmq:4.2-alpine
    restart: unless-stopped
    env_file:
      - path: broker.env
        format: raw
    volumes:
      - iris_broker:/var/lib/rabbitmq
    networks:
      - iris-backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  iris-app:
    <<: *iris-runtime
    command: ["nohup", "./iris-entrypoint.sh", "iriswebapp"]
    depends_on:
      iris-db:
        condition: service_healthy
      iris-rabbitmq:
        condition: service_healthy
    networks:
      - iris-backend
      - iris-frontend
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=5)"]
      start_period: 60s
      interval: 10s
      timeout: 8s
      retries: 18

  iris-worker:
    <<: *iris-runtime
    networks:
      - iris-backend
      - iris-egress
    command: ["./wait-for-iriswebapp.sh", "iris-app:8000", "./iris-entrypoint.sh", "iris-worker"]
    depends_on:
      iris-app:
        condition: service_healthy
      iris-rabbitmq:
        condition: service_healthy

  iris-nginx:
    image: ghcr.io/dfir-iris/iriswebapp_nginx:${IRIS_VERSION:?IRIS_VERSION is required}
    restart: unless-stopped
    depends_on:
      iris-app:
        condition: service_healthy
    environment:
      IRIS_UPSTREAM_SERVER: iris-app
      IRIS_UPSTREAM_PORT: "8000"
      INTERFACE_HTTPS_PORT: ${IRIS_HTTPS_PORT:?IRIS_HTTPS_PORT is required}
      SERVER_NAME: ${IRIS_SERVER_NAME:?IRIS_SERVER_NAME is required}
      CERT_FILENAME: iris.crt
      KEY_FILENAME: iris.key
      IRIS_AUTHENTICATION_TYPE: local
    ports:
      - "${IRIS_BIND_ADDRESS:?IRIS_BIND_ADDRESS is required}:${IRIS_HTTPS_PORT}:${IRIS_HTTPS_PORT}"
    volumes:
      - ./certificates/web_certificates:/www/certs:ro
    networks:
      - iris-frontend

volumes:
  iris_database:
  iris_broker:
  iris_downloads:
  iris_templates:
  iris_server_data:

networks:
  iris-backend:
    internal: true
  iris-frontend:
  iris-egress:
