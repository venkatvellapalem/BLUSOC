# Local test API only. This is not a Wazuh or IRIS deployment.
name: blusoc-sandbox
services:
  iris-mock:
    image: python:3.12-slim
    working_dir: /app
    command:
    - python
    - -u
    - /app/mock_iris_server.py
    - '8000'
    environment:
      MOCK_BIND_ADDRESS: 0.0.0.0
      PYTHONDONTWRITEBYTECODE: '1'
    ports:
    - 127.0.0.1:8000:8000
    volumes:
    - ./mock_iris_server.py:/app/mock_iris_server.py:ro
    read_only: true
    tmpfs:
    - /tmp
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
